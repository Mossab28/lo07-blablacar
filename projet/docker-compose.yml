services:
  web:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: blablacar2026
      DB_USER: blabla
      DB_PASS: blabla_pwd
    depends_on:
      - db
    networks:
      - dokploy-network
      - appnet
    ports:
      - "8090:80"
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.blablacar.rule=Host(`blablacar.51-91-121-153.sslip.io`)
      - traefik.http.routers.blablacar.entrypoints=web
      - traefik.http.services.blablacar.loadbalancer.server.port=80

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_pwd
      MYSQL_DATABASE: blablacar2026
      MYSQL_USER: blabla
      MYSQL_PASSWORD: blabla_pwd
    volumes:
      - ./sql/blablacar2026.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - blabla_data:/var/lib/mysql
    networks:
      - appnet
    restart: unless-stopped

volumes:
  blabla_data:

networks:
  dokploy-network:
    external: true
  appnet:
